<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TJW Progress Tracker — starting up</title>
  <!-- Deliberately standalone: this page must render when the database is down,
       so it must not extend base.html or depend on any query. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 560px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4 text-center">
        <div style="font-size: 2.5rem;">⏳</div>
        <h1 class="h4 mt-2">The tracker is starting up</h1>
        <p class="text-muted mb-4">
          The database is still waking up. This usually clears within a minute —
          nothing you logged has been lost.
        </p>
        <button class="btn btn-primary" onclick="window.location.reload()">Try again</button>
        <p class="text-muted small mt-4 mb-0">
          Still seeing this after a few minutes? Let Arindam know.
        </p>
      </div>
    </div>
  </div>
  <script>setTimeout(function () { window.location.reload(); }, 30000);</script>
</body>
</html>
